services:
  - type: web
    name: inboxready
    runtime: python
    plan: starter
    rootDir: API
    buildCommand: pip install .
    startCommand: uvicorn inboxready_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: INBOXREADY_HTTP_TIMEOUT_SECONDS
        value: 5.0
      - key: INBOXREADY_USER_AGENT
        value: InboxReady/0.7 (+https://github.com/Sebby1770/inboxready-api)
      # Makes the site crawlable and marks pages index,follow. Anything other
      # than "production" serves a blanket robots.txt disallow instead.
      - key: INBOXREADY_ENVIRONMENT
        value: production
      # Required for correct canonical URLs, sitemap entries, and og:image.
      - key: INBOXREADY_SITE_BASE_URL
        sync: false
      # Set to a G-XXXXXXXXXX measurement ID to enable consent-gated analytics.
      - key: INBOXREADY_ANALYTICS_GA4_ID
        sync: false
      # Set these before taking real traffic.
      - key: INBOXREADY_API_KEYS
        sync: false
      - key: INBOXREADY_RATE_LIMIT_PER_MINUTE
        value: 60
